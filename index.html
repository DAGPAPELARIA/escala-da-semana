<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escala da semana - Terça a domingo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#214A7C;--graf:#A0A0A0;--ink:#0F1923;
  --hf:"Baloo 2 SemiBold","Baloo 2",system-ui,sans-serif;--bf:"Baloo 2",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:var(--bf);-webkit-font-smoothing:antialiased;color:#fff}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--navy)}

/* bolhas de fundo */
.bl{position:absolute;border-radius:50%;pointer-events:none;animation:float 16s ease-in-out infinite alternate}
.bl.a{width:620px;height:620px;right:-200px;top:-230px;background:rgba(255,255,255,.07)}
.bl.b{width:420px;height:420px;left:-150px;bottom:-170px;background:rgba(255,255,255,.05);animation-delay:-6s}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(-36px,30px) scale(1.07)}}

/* cabeçalho */
.eyebrow{position:absolute;left:96px;top:54px;font-size:22px;letter-spacing:.28em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.74)}
h1{position:absolute;left:96px;top:92px;font-family:var(--hf);font-weight:600;font-size:76px;line-height:1;letter-spacing:-.01em}
.logo{position:absolute;right:96px;top:56px;height:56px}
.in{animation:rise .7s cubic-bezier(.2,.9,.3,1.1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

/* colunas */
#cols{position:absolute;left:96px;top:196px;width:1728px;height:704px;display:grid;grid-template-columns:repeat(7,1fr);gap:14px}
.col{background:rgba(255,255,255,.08);border-radius:30px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:5px;overflow:hidden;
  animation:rise .7s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--i)*110ms + 150ms)}
.col .hd{padding:0 8px 6px;border-bottom:2px solid rgba(255,255,255,.2);margin-bottom:4px}
.col .hd b{display:block;font-family:var(--hf);font-weight:600;font-size:32px;line-height:1.05}
.col .hd span{font-size:19px;color:rgba(255,255,255,.7)}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:23px;line-height:1;color:#fff;background:rgba(255,255,255,.14);border:2px solid transparent;border-radius:22px;padding:5px 14px;cursor:pointer;
  transition:background .25s,color .25s,opacity .25s,transform .25s;
  animation:pop .45s cubic-bezier(.3,1.6,.4,1) backwards;animation-delay:calc(var(--i)*110ms + var(--j)*45ms + 450ms)}
.chip:hover{background:rgba(255,255,255,.26)}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:none}}
body.sel .chip{opacity:.22}
body.sel .chip.on{opacity:1;background:#fff;color:var(--navy);transform:scale(1.04)}

/* grupos e marcas */
.grp{border:2px dashed rgba(255,255,255,.6);border-radius:22px;padding:6px 7px 7px;margin-top:5px;display:flex;flex-direction:column;gap:5px}
.grp .tg{align-self:flex-start;font-family:var(--hf);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase;background:var(--graf);color:var(--navy);border-radius:14px;padding:3px 12px;margin-bottom:2px}
.grp .chip{padding:4px 12px;font-size:22px}
.fim{margin-top:auto;display:flex;align-items:center;gap:8px;font-family:var(--hf);font-weight:600;font-size:24px;background:var(--graf);color:var(--navy);border-radius:18px;padding:8px 14px}
.def{border:2px dashed rgba(255,255,255,.5);border-radius:22px;padding:8px 14px;font-size:24px;color:rgba(255,255,255,.85)}
.nota{font-size:20px;line-height:1.2;color:rgba(255,255,255,.88)}
.nota b{font-family:var(--hf);font-weight:600;display:block;font-size:22px;color:#fff}
.nota i{font-style:normal;display:block}
.vol{margin-top:6px;display:flex;flex-direction:column;gap:10px}
.vol .tg{font-family:var(--hf);font-weight:600;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--graf)}
.obs{margin-top:auto;font-size:19px;color:rgba(255,255,255,.75)}
.obs b{font-family:var(--hf);font-weight:600;color:#fff}
.rob{background:#fff;color:var(--navy);font-family:var(--hf);font-weight:600;font-size:30px;border-radius:24px;padding:12px 16px}
.rob small{display:block;font-family:var(--bf);font-weight:400;font-size:20px;line-height:1.2;color:var(--navy);opacity:.85;margin-top:4px}
.lanche{margin-top:auto;border:2px solid #fff;border-radius:22px;padding:12px 14px;font-family:var(--hf);font-weight:600;font-size:24px;line-height:1.15;text-align:center}

/* quadrado do rodapé: volta de domingo */
#dom{position:absolute;left:96px;top:914px;width:930px;height:106px;border:2px solid rgba(255,255,255,.65);border-radius:26px;background:rgba(255,255,255,.08);padding:10px 18px 10px;display:flex;flex-direction:column;justify-content:center;gap:8px;
  animation:rise .7s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:1.1s}
#dom .tg{align-self:flex-start;font-family:var(--hf);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase;background:var(--graf);color:var(--navy);border-radius:14px;padding:2px 12px}
#dom .row{display:flex;align-items:center;gap:22px}
#dom .it{display:flex;align-items:center;gap:12px;font-size:21px;color:rgba(255,255,255,.9);line-height:1.15}
#dom .it .chip{width:auto;font-size:23px;padding:5px 16px}
#dom .obs{margin:0 0 0 auto;font-size:20px;color:rgba(255,255,255,.8);white-space:nowrap}
#dom .obs b{font-family:var(--hf);font-weight:600;color:#fff}

/* resumo da pessoa (no cabeçalho) e filtro de nomes (rodapé) */
#who{position:absolute;left:820px;top:78px;width:780px;height:96px;font-size:25px;line-height:1.25;color:rgba(255,255,255,.85);display:flex;align-items:center}
#who b{font-family:var(--hf);font-weight:600;color:#fff;margin-right:12px;font-size:34px}
#bar{position:absolute;left:1050px;top:914px;width:774px;height:106px;display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}
#bar .chip{width:auto;font-size:19px;padding:4px 10px;text-align:center;white-space:nowrap}
#bar .chip em{font-style:normal;opacity:.7;margin-left:6px}
#bar .chip.on em{opacity:1}
.foot{position:absolute;left:96px;bottom:10px;font-size:17px;color:rgba(255,255,255,.55)}

/* modo celular (largura menor que 1000px): layout em uma coluna, com rolagem */
html.mob,html.mob body{height:auto;overflow:auto;background:var(--navy)}
html.mob #stage{position:relative;left:0;top:0;transform:none!important;width:100%;height:auto;min-height:100vh;overflow:visible;display:flex;flex-direction:column;padding:18px 14px 30px}
html.mob .bl{display:none}
html.mob .eyebrow{position:static;order:0;font-size:13px;margin:0 0 2px}
html.mob h1{position:static;order:1;font-size:40px;margin:8px 0 12px}
html.mob .logo{position:absolute;right:14px;top:14px;height:28px}
html.mob #bar{position:sticky;top:0;z-index:20;order:2;left:auto;width:auto;height:auto;margin:0 -14px 8px;padding:10px 14px;background:var(--navy);border-bottom:1px solid rgba(255,255,255,.18);flex-wrap:nowrap;overflow-x:auto;gap:8px;-webkit-overflow-scrolling:touch}
html.mob #bar .chip{flex:none;font-size:17px;padding:7px 13px}
html.mob #who{position:static;order:3;width:auto;height:auto;min-height:46px;font-size:16px;margin:2px 0 12px}
html.mob #who b{font-size:22px;margin-right:8px}
html.mob #cols{position:static;order:4;width:auto;height:auto;display:flex;flex-direction:column;gap:12px}
html.mob .col{padding:12px;border-radius:22px;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:8px;overflow:visible}
html.mob .col .hd{width:100%;margin-bottom:0}
html.mob .col .hd b{font-size:26px}
html.mob .col .chip{width:auto;font-size:18px;padding:7px 14px}
html.mob .grp,html.mob .fim,html.mob .def,html.mob .lanche{width:100%}
html.mob .grp{flex-direction:row;flex-wrap:wrap;align-items:center}
html.mob .grp .tg{width:100%;background:none;color:#fff;padding:0 4px;font-size:15px}
html.mob .grp .chip{font-size:17px}
html.mob .col .chip.rob{width:100%;font-size:26px}
html.mob #dom{position:static;order:5;width:auto;height:auto;margin-top:12px;padding:14px 14px}
html.mob #dom .row{flex-wrap:wrap;gap:12px 18px}
html.mob #dom .it{font-size:17px;flex-wrap:wrap}
html.mob #dom .it .chip{font-size:18px}
html.mob #dom .obs{margin-left:0;width:100%;font-size:17px}
html.mob .foot{position:static;order:6;margin-top:16px;font-size:14px}

/* modo impressão (?print) */
@page{size:1920px 1080px;margin:0}
html.print,html.print body{height:auto!important;overflow:visible!important;background:#fff!important}
html.print,html.print *{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important;transition:none!important}
html.print #stage{position:relative!important;left:0!important;top:0!important;transform:none!important}
@media (prefers-reduced-motion:reduce){.bl{animation:none}}
html.pronto .chip,html.pronto .col,html.pronto #dom,html.pronto .in{animation:none!important}
</style>
</head>

const total=d=>d.n?d.n.length+(d.g?d.g.n.length:0):0;

/* dias de cada pessoa */
const diasDe={};
DIAS.forEach(d=>{
  const nomes=[...(d.n||[]),...(d.g?d.g.n:[])];
  nomes.forEach(n=>{(diasDe[n]=diasDe[n]||[]).push(d.d);});
});
const nomes=Object.keys(diasDe).sort((a,b)=>diasDe[b].length-diasDe[a].length||a.localeCompare(b,'pt'));

/* colunas */
let html='';
DIAS.forEach((d,i)=>{
  let j=0,body='';
  if(d.def){
    body+=`<div class="def">À definir</div>`;
  }else{
    body+=d.n.map(n=>chip(n,i,j++)).join('');
    if(d.g)body+=`<div class="grp"><span class="tg">${d.g.h}</span>${d.g.n.map(n=>chip(n,i,j++)).join('')}</div>`;
    if(d.oroch)body+=`<div class="grp"><span class="tg">Oroch</span>${d.oroch.map(n=>chip(n,i,j++)).join('')}</div>`;
    if(d.fim)body+=`<div class="fim">${esc(d.fim)}</div>`;
  }
  html+=`<div class="col" style="--i:${i}"><div class="hd"><b>${d.d}</b><span>${d.def?'equipe a definir':total(d)+' pessoas'}</span></div>${body}</div>`;
});
/* coluna até 22h */
const iR=DIAS.length;
html+=`<div class="col" style="--i:${iR}"><div class="hd"><b>Até 22h</b><span>todos os dias</span></div>
  <button class="chip rob" data-n="${ROBERTO}" style="--i:${iR};--j:0">${ROBERTO}<small>acompanhando todos os dias</small></button>
  <div class="lanche">Pedir lanche todos os dias</div></div>`;
document.getElementById('cols').innerHTML=html;

/* quadrado do rodapé: volta de domingo (Phelipe e Willian) */
const domDia=DIAS.find(d=>d.def);
document.getElementById('dom').innerHTML=`<div class="row">${domDia.notas.map(([n,t],k)=>`<div class="it"><button class="chip" data-n="${esc(n)}" style="--i:6;--j:${k+2}">${esc(n)}</button><span>${esc(t)}</span></div>`).join('')}
  <div class="obs"><b>Obs.:</b> ${esc(domDia.obs)}</div></div>`;

/* barra de nomes */
document.getElementById('bar').innerHTML=[...nomes,ROBERTO].map((n,k)=>{
  const qtd=n===ROBERTO?'todos':diasDe[n].length;
  return `<button class="chip" data-n="${esc(n)}" style="--i:0;--j:${k+8}">${esc(n)}<em>${qtd}</em></button>`;
}).join('');

/* interação: tocar em um nome destaca a pessoa em todos os dias */
const who=document.getElementById('who');
const dica='Toque em um nome para ver todos os dias dele. O número ao lado de cada nome na barra é a quantidade de dias.';
who.textContent=dica;
let sel=null;
function mostrar(n){
  sel=n;
  document.body.classList.toggle('sel',!!n);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',!!n&&c.dataset.n===n));
  if(!n){who.textContent=dica;return;}
  if(n===ROBERTO){who.innerHTML=`<b>${ROBERTO}</b>acompanhando todos os dias, até 22h`;return;}
  const dd=diasDe[n],dom=NOTAS_DOM[n],ter=NOTAS_TER[n];
  who.innerHTML=`<b>${esc(n)}</b>${dd.join(', ')} · ${dd.length} ${dd.length===1?'dia':'dias'}${ter?' · terça: '+ter:''}${dom?' · domingo: '+dom:''}`;
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(c&&c.dataset.n){mostrar(sel===c.dataset.n?null:c.dataset.n);}
  else mostrar(null);
});

/* escala da tela */
/* mede a tela de verdade (celular, WhatsApp, tablet) e posiciona o quadro a partir do canto,
   para nenhuma coluna ficar cortada fora da tela */
function fit(){
  const de=document.documentElement;
  const vw=de.clientWidth||innerWidth;
  const vh=(window.visualViewport&&visualViewport.height)||innerHeight||de.clientHeight;
  const mob=vw<1000&&!/[?&]print\b/.test(location.search);
  de.classList.toggle('mob',mob);
  const st=document.getElementById('stage');
  if(mob){st.style.transform='none';st.style.left='';st.style.top='';st.style.transformOrigin='';return;}
  const s=Math.min(vw/1920,vh/1080);
  st.style.left='0';st.style.top='0';st.style.transformOrigin='0 0';
  st.style.transform=`translate(${Math.max(0,(vw-1920*s)/2)}px,${Math.max(0,(vh-1080*s)/2)}px) scale(${s})`;
}
['resize','orientationchange','load','pageshow'].forEach(ev=>addEventListener(ev,fit));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(document.documentElement);
fit();setTimeout(fit,300);setTimeout(fit,1200);
/* garantia: se a animação de entrada não rodar (aba em segundo plano, economia de bateria),
   todos os nomes aparecem mesmo assim */
setTimeout(()=>document.documentElement.classList.add('pronto'),2600);
if(/[?&]print\b/.test(location.search))document.documentElement.classList.add('print');
</script>
